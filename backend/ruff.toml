line-length = 110
target-version = "py311"

[lint]
# ARG is deliberately absent: FastAPI and slowapi require `request` and
# `response` parameters that a handler body often never touches.
select = ["F", "E", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "C4"]

# FastAPI's dependency injection is expressed through call defaults; that is the
# framework's idiom, not a mutable-default bug.
flake8-bugbear.extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

[lint.per-file-ignores]
# Scripts intentionally configure sys.path before importing the app package.
"scripts/*" = ["E402"]
"tests/*" = ["SLF001"]
