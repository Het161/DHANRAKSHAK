<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="DhanRakshak — on-device, offline-first scam guardian">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04211a"/>
      <stop offset="0.55" stop-color="#083527"/>
      <stop offset="1" stop-color="#0a4531"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <path id="shieldPath" d="M65 4 L126 26 V72 C126 114 100 141 65 152 C30 141 4 114 4 72 V26 Z"/>
    <clipPath id="shieldClip"><use href="#shieldPath"/></clipPath>
    <clipPath id="titleClip"><text x="300" y="150" font-family="Verdana,Geneva,sans-serif" font-size="72" font-weight="700">DhanRakshak</text></clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <!-- faint dotted grid -->
  <g fill="#5eead4" opacity="0.06">
    <circle cx="1120" cy="70" r="3"/><circle cx="1170" cy="120" r="3"/><circle cx="1070" cy="120" r="3"/>
    <circle cx="1210" cy="80" r="3"/><circle cx="1150" cy="200" r="3"/><circle cx="1210" cy="250" r="3"/>
    <circle cx="1090" cy="240" r="3"/><circle cx="1000" cy="290" r="3"/>
  </g>

  <!-- shield -->
  <g transform="translate(72,92)">
    <!-- pulsing rings -->
    <circle cx="65" cy="80" r="80" fill="url(#glow)">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="65" cy="80" r="70" fill="none" stroke="#34d399" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="66;92;66" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- shield body -->
    <use href="#shieldPath" fill="#0e7c5a" fill-opacity="0.35" stroke="#5eead4" stroke-width="3"/>
    <!-- radar scan sweep, clipped to the shield -->
    <g clip-path="url(#shieldClip)">
      <rect x="0" y="-18" width="130" height="36" fill="url(#scan)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,150; 0,0" keyTimes="0;0.5;1" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- checkmark that draws itself in -->
    <path d="M38 80 L58 100 L94 52" fill="none" stroke="#5eead4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="120" stroke-dashoffset="120">
      <animate attributeName="stroke-dashoffset" values="120;120;0;0;120" keyTimes="0;0.15;0.45;0.85;1" dur="4.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title -->
  <text x="300" y="150" font-family="Verdana,Geneva,sans-serif" font-size="72" font-weight="700" fill="#f4f1ea">DhanRakshak</text>
  <!-- shimmer sweep over the title -->
  <g clip-path="url(#titleClip)">
    <rect x="-260" y="80" width="220" height="90" fill="url(#shine)" opacity="0.65">
      <animate attributeName="x" values="-260;920" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- native-script identity -->
  <text x="302" y="196" font-family="Verdana,Geneva,sans-serif" font-size="30" font-weight="600" fill="#7fe8c6">ધનરક્ષક &#183; धनरक्षक &#183; your scam guardian</text>
  <!-- tagline -->
  <text x="302" y="234" font-family="Verdana,Geneva,sans-serif" font-size="21" fill="#a7cabb">Check before you trust. The real detector runs on your phone, even with no signal.</text>

  <!-- animated feature pills -->
  <g font-family="Verdana,Geneva,sans-serif" font-size="17" font-weight="600" fill="#d7efe4">
    <g transform="translate(302,266)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#0e7c5a" fill-opacity="0.25" stroke="#34d399" stroke-opacity="0.5"/>
      <circle cx="20" cy="17" r="5" fill="#5eead4"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
      <text x="34" y="22">On-device</text>
    </g>
    <g transform="translate(464,266)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#0e7c5a" fill-opacity="0.25" stroke="#34d399" stroke-opacity="0.5"/>
      <circle cx="20" cy="17" r="5" fill="#5eead4"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="0.5s" repeatCount="indefinite"/></circle>
      <text x="34" y="22">Offline-first</text>
    </g>
    <g transform="translate(626,266)">
      <rect x="0" y="0" width="164" height="34" rx="17" fill="#0e7c5a" fill-opacity="0.25" stroke="#34d399" stroke-opacity="0.5"/>
      <circle cx="20" cy="17" r="5" fill="#5eead4"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="1s" repeatCount="indefinite"/></circle>
      <text x="34" y="22">Gujarati-first</text>
    </g>
  </g>
</svg>
