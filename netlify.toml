# Netlify build for the frontend (a Next.js static export).
# The backend is a separate Render service; the browser talks to it directly.

[build]
  base = "frontend"
  command = "npm run build"
  # Relative to `base`, so this is frontend/out (the static export output).
  publish = "out"

# Security headers, served by Netlify. A static export cannot emit them itself,
# so they moved here from next.config.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), interest-cohort=()"

# Long-cache the hashed build assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must NEVER be cached by the browser or the CDN. If a stale
# sw.js is served, users are pinned to an old app forever and never see updates.
# no-cache forces revalidation on every load, so a new deploy's worker is picked
# up promptly (it then waits for the "App updated - refresh" toast before taking
# over). Service-Worker-Allowed keeps the worker's control scope at the origin root.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
