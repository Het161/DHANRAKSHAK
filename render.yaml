services:
  - type: web
    name: dhanrakshak-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: STT_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.1-8b-instant
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_VOICE_MODEL
        value: llama-3.1-8b-instant
      - key: TTS_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
